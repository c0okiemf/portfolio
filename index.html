<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />

    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Igor Piciughin — senior fullstack engineer working remotely from Moldova. Web apps, APIs, and cloud infrastructure. TypeScript, React, Vue, PHP, and AWS."
    />
    <meta name="theme-color" content="#f6f7f3" />
    <script>
      try {
        const saved = localStorage.getItem('portfolio-theme');
        document.documentElement.dataset.theme =
          saved === 'dark' ||
          (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light';
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      }
    </script>
    <title>Igor Piciughin — Senior Fullstack Engineer</title>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
